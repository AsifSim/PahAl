<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamuna Test Execution</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #050810;
            --panel-bg: rgba(10, 15, 25, 0.6);
            --neon-blue: #00d2ff;
            --neon-cyan: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --pass-color: #00e676;
            --fail-color: #ff3d00;
            --running-color: #fbc02d;
            --border-glow: rgba(0, 210, 255, 0.3);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Particle Network Background */
        #network-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
        }

        .container {
            max-width: 1500px; margin: 40px auto; padding: 20px;
            display: flex;
            justify-content: center; /* Centers the panels */
            align-items: flex-start;
            flex-wrap: wrap; /* Allows wrapping on smaller screens */
            gap: 30px;
            position: relative; z-index: 1;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px dashed var(--border-glow);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 210, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 700px; /* Fixes the width so it stays clean */
        }

        /* Drag and Drop Zone */
        .drop-zone {
            border: 2px dashed var(--neon-blue);
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 30px;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.2);
        }
        .drop-zone:hover, .drop-zone.dragover {
            background: rgba(0, 210, 255, 0.1);
            box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.2);
        }

        h1.title {
            text-align: center; color: var(--neon-blue);
            font-size: 2.5rem; font-weight: 800; letter-spacing: 2px;
            text-shadow: 0 0 15px var(--neon-blue);
            margin-top: 40px; margin-bottom: 20px;
        }

        h2 { font-size: 1.5rem; color: var(--neon-cyan); margin-top: 0; margin-bottom: 20px; }

        /* Buttons */
        .btn {
            background: rgba(0, 210, 255, 0.1); color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 8px 16px; border-radius: 4px; cursor: pointer;
            font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn:hover:not(:disabled) {
            background: var(--neon-blue); color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .btn:disabled {
            border-color: var(--text-muted); color: var(--text-muted);
            cursor: not-allowed; opacity: 0.5;
        }

        .btn-execute-all {
            width: 100%; padding: 15px; font-size: 1.2rem; margin-bottom: 25px;
            background: linear-gradient(90deg, rgba(0,210,255,0.1) 0%, rgba(0,255,204,0.1) 100%);
            border-color: var(--neon-cyan); color: var(--neon-cyan);
        }

        .btn-execute-all:hover:not(:disabled) {
            background: var(--neon-cyan); color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        /* Table Styles */
        .table-container { max-height: 500px; overflow-y: auto; }
        .table-container::-webkit-scrollbar { width: 8px; }
        .table-container::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 4px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: var(--text-muted); position: sticky; top: 0; background: var(--panel-bg); z-index: 10;}
        tr { transition: background 0.2s ease; }
        tr:hover { background: rgba(255,255,255,0.03); }

        .params-cell { font-family: monospace; font-size: 0.85rem; color: #a5d6ff; word-break: break-all; max-width: 200px; }

        /* Status Indicators */
        .status { font-weight: bold; letter-spacing: 1px; }
        .status-idle { color: var(--text-muted); }
        .status-pass { color: var(--pass-color); text-shadow: 0 0 10px var(--pass-color); }
        .status-fail { color: var(--fail-color); text-shadow: 0 0 10px var(--fail-color); }
        .status-running { color: var(--running-color); animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Results Panel */
        .results-panel {
            display: none; /* Hidden by default to keep left panel centered */
            flex-direction: column;
            gap: 20px;
        }

        .results-panel.active {
            display: flex;
            animation: slideIn 0.5s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .chart-container { position: relative; height: 300px; width: 100%; }

        .log-container {
            background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px;
            font-family: monospace; font-size: 0.9rem; max-height: 250px; overflow-y: auto;
            border-left: 3px solid var(--neon-blue);
        }

        .log-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .log-label { color: var(--text-muted); }

    </style>
</head>
<body>

<canvas id="network-canvas"></canvas>

<h1 class="title">YAMUNA</h1>

<div class="container">
    <div class="glass-panel" id="execution-panel">

        <div id="drop-zone" class="drop-zone"
             ondrop="handleDrop(event)"
             ondragover="handleDragOver(event)"
             ondragleave="handleDragLeave(event)">
            <h2 style="color: var(--neon-blue); margin-bottom: 5px;">Drag & Drop Scenario JSON</h2>
            <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">Drop your all_pair_matrix configuration here</p>
        </div>

        <h2>Test Execution Blueprint</h2>
        <button id="btn-execute-all" class="btn btn-execute-all" onclick="executeAllTests()">▶ Execute All Tests</button>

        <div class="table-container">
            <table id="test-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Params</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="test-tbody">
                </tbody>
            </table>
        </div>
    </div>

    <div class="glass-panel results-panel" id="results-panel">
        <h2>Execution Analytics</h2>
        <div class="chart-container">
            <canvas id="resultsChart"></canvas>
        </div>

        <h2 style="margin-top: 20px;">Execution Logs</h2>
        <div class="log-container" id="log-container">
            <div style="color: var(--text-muted);">Waiting for execution...</div>
        </div>
    </div>
</div>

<script>
    // --- 1. Background Network Animation with Mouse Interaction ---
    const canvas = document.getElementById('network-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];

    // Mouse tracking
    let mouse = { x: null, y: null, radius: 150 };

    window.addEventListener('mousemove', function(event) {
        mouse.x = event.x;
        mouse.y = event.y;
    });

    window.addEventListener('mouseout', function() {
        mouse.x = null;
        mouse.y = null;
    });

    function initCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        // Increased density to 300 particles
        for(let i = 0; i < 300; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                radius: Math.random() * 2 + 0.5
            });
        }
    }

    function drawNetwork() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = 'rgba(0, 210, 255, 0.5)';

        for(let i = 0; i < particles.length; i++) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;

            // Bounce off edges
            if(p.x < 0 || p.x > width) p.vx *= -1;
            if(p.y < 0 || p.y > height) p.vy *= -1;

            // Mouse interaction physics
            if (mouse.x != null && mouse.y != null) {
                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let distance = Math.hypot(dx, dy);

                if (distance < mouse.radius) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(0, 210, 255, ${0.8 - distance/mouse.radius})`;
                    ctx.lineWidth = 1;
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.stroke();

                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const force = (mouse.radius - distance) / mouse.radius;
                    p.x -= forceDirectionX * force * 1.5;
                    p.y -= forceDirectionY * force * 1.5;
                }
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();

            // Connect particles
            for(let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j];
                let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if(dist < 120) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(0, 210, 255, ${1 - dist/120})`;
                    ctx.lineWidth = 0.5;
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(drawNetwork);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas(); drawNetwork();

    // --- 2. Test Execution Logic & State ---
    let mockTests = []; // Starts empty, waiting for JSON drop
    let executionStats = { passed: 0, failed: 0, pending: 0 };
    let resultsChart;
    let isExecutingAll = false;

    // --- 3. Drag and Drop Handling ---
    function handleDragOver(e) {
        e.preventDefault();
        document.getElementById('drop-zone').classList.add('dragover');
    }

    function handleDragLeave(e) {
        e.preventDefault();
        document.getElementById('drop-zone').classList.remove('dragover');
    }

    function handleDrop(e) {
        e.preventDefault();
        document.getElementById('drop-zone').classList.remove('dragover');

        const file = e.dataTransfer.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const data = JSON.parse(event.target.result);
                if (data.all_pair_matrix && data.all_pair_matrix.combinations) {
                    // Map the combinations to our UI array
                    mockTests = data.all_pair_matrix.combinations.map(c => ({
                        id: c.id,
                        params: c.params,
                        expected_output: c.expected_output,
                        status: 'Idle'
                    }));

                    // Show the results panel and clear initial log msg
                    document.getElementById('results-panel').classList.add('active');
                    document.getElementById('log-container').innerHTML = '';

                    renderTable();
                    updateStats();
                } else {
                    alert("Invalid JSON format. Make sure it contains 'all_pair_matrix.combinations'");
                }
            } catch (err) {
                alert("Error parsing JSON file: " + err.message);
            }
        };
        reader.readAsText(file);
    }

    // Render Table
    function renderTable() {
        const tbody = document.getElementById('test-tbody');
        tbody.innerHTML = '';
        mockTests.forEach((test, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${test.id}</td>
                <td class="params-cell">${JSON.stringify(test.params)}</td>
                <td id="status-${index}" class="status status-${test.status.toLowerCase()}">${test.status}</td>
                <td>
                    <button id="btn-${index}" class="btn" onclick="executeSingleTest(${index})">Execute</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Initialize Chart.js
    function initChart() {
        const ctxChart = document.getElementById('resultsChart').getContext('2d');
        Chart.defaults.color = '#8892b0';
        resultsChart = new Chart(ctxChart, {
            type: 'doughnut',
            data: {
                labels: ['Passed', 'Failed', 'Pending'],
                datasets: [{
                    data: [0, 0, 0], // Starts at 0 until data is loaded
                    backgroundColor: ['#00e676', '#ff3d00', '#2a3b5c'],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'right' } },
                cutout: '70%'
            }
        });
    }

    // Execute a Single Test via Backend Payload Structure
    async function executeSingleTest(index) {
        const test = mockTests[index];
        if(test.status === 'Running') return;

        updateUIState(index, 'Running');

        // Constructed exactly as per TestExecutionRequest record definition
        const payload = {
            requestData: test.params, // Map<String, Object>
            responseList: [],
            entity: "DEFAULT_ENTITY",
            workflowId: test.id,
            endpoints: [{ functionName: "validate", version: "1.0" }],
            communicationType: "REST",
            version: "1.0"
        };

        try {
            const response = await fetch('http://localhost:8080/api/yamuna/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

            // If the connection succeeds and processes, we log it as Pass.
            // (You can add specific response body checking here if needed)
            updateUIState(index, 'Pass');
            appendLog(test.id, {
                status: 'Pass',
                expected: test.expected_output ? test.expected_output.status : "SUCCESS",
                actual: "Connection Successful, Status Code 200"
            });
            updateStats();

        } catch (e) {
            console.error(`Error on ${test.id}:`, e);
            updateUIState(index, 'Fail');
            appendLog(test.id, {
                status: 'Fail',
                expected: test.expected_output ? test.expected_output.status : "SUCCESS",
                actual: e.message
            });
            updateStats();
        }
    }

    // Execute All Sequentially
    async function executeAllTests() {
        if(isExecutingAll || mockTests.length === 0) return;
        isExecutingAll = true;
        document.getElementById('btn-execute-all').disabled = true;
        document.getElementById('log-container').innerHTML = ''; // Clear logs

        // Reset all statuses
        mockTests.forEach((t, i) => updateUIState(i, 'Idle'));
        updateStats();

        for (let i = 0; i < mockTests.length; i++) {
            document.querySelectorAll('#test-tbody .btn').forEach(b => b.disabled = true);
            await executeSingleTest(i);
        }

        isExecutingAll = false;
        document.getElementById('btn-execute-all').disabled = false;
        document.querySelectorAll('#test-tbody .btn').forEach(b => b.disabled = false);
    }

    // Helper: Update UI State
    function updateUIState(index, status) {
        mockTests[index].status = status;
        const statusCell = document.getElementById(`status-${index}`);
        statusCell.textContent = status;
        statusCell.className = `status status-${status.toLowerCase()}`;

        const btn = document.getElementById(`btn-${index}`);
        if(status === 'Running') {
            btn.textContent = 'Running...';
            btn.disabled = true;
        } else {
            btn.textContent = 'Execute';
            btn.disabled = false;
        }
    }

    // Helper: Append to Log Panel
    function appendLog(id, result) {
        const logContainer = document.getElementById('log-container');
        const logHTML = `
            <div class="log-entry">
                <strong style="color: ${result.status === 'Pass' ? 'var(--pass-color)' : 'var(--fail-color)'}">
                    [${id}] ${result.status.toUpperCase()}
                </strong><br/>
                <span class="log-label">Expected:</span> ${result.expected}<br/>
                <span class="log-label">Actual:</span> <span style="color: ${result.status === 'Fail' ? 'var(--fail-color)' : 'inherit'}">${result.actual}</span>
            </div>
        `;
        logContainer.insertAdjacentHTML('afterbegin', logHTML);
    }

    // Helper: Update Chart.js Stats
    function updateStats() {
        if (!resultsChart) return;

        const passed = mockTests.filter(t => t.status === 'Pass').length;
        const failed = mockTests.filter(t => t.status === 'Fail').length;
        const pending = mockTests.length - (passed + failed);

        resultsChart.data.datasets[0].data = [passed, failed, pending];
        resultsChart.update();
    }

    // Initialize Application
    window.onload = () => {
        initChart();
    };

</script>
</body>
</html>
