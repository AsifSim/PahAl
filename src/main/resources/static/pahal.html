<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { background: #050505; margin: 0; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; z-index: 0; }
        .glass-ui {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(6, 182, 212, 0.3);
            transition: all 0.4s ease;
        }
        .pulse-glow { animation: pulse 3s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.2); } 50% { box-shadow: 0 0 50px rgba(6, 182, 212, 0.4); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen w-screen text-white font-sans">
<canvas id="canvas"></canvas>

<div id="content" class="relative z-10 text-center w-full max-w-4xl px-4">
    <h1 class="text-8xl font-black tracking-tighter uppercase mb-12 text-cyan-500 drop-shadow-[0_0_15px_rgba(6,182,212,0.5)]">PahAl</h1>

    <div id="drop-zone" class="glass-ui pulse-glow w-full h-[400px] rounded-3xl flex flex-col items-center justify-center cursor-pointer border-dashed border-4 border-cyan-900/50 hover:border-cyan-400">
        <div class="text-cyan-500 text-6xl font-bold mb-4">Generate FSM</div>
        <p id="status-text" class="text-gray-300 text-2xl font-light">Drop your TBRD blueprint here</p>
        <input type="file" id="fileInput" class="hidden" accept=".docx">
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const mouse = { x: null, y: null };
    window.onmousemove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };

    // 400 particles for high density
    const particles = Array.from({length: 400}, () => ({
        x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        sx: Math.random()*0.4-0.2, sy: Math.random()*0.4-0.2
    }));

    function animate() {
        ctx.clearRect(0,0, canvas.width, canvas.height);

        // Link nearby particles
        ctx.lineWidth = 0.5;
        for(let i=0; i<particles.length; i++) {
            for(let j=i+1; j<particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 100) {
                    ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist/100})`;
                    ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                }
            }
        }

        particles.forEach(p => {
            const dx = mouse.x - p.x, dy = mouse.y - p.y, dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 150) { p.x -= dx*0.01; p.y -= dy*0.01; }
            p.x += p.sx; p.y += p.sy;
            if(p.x < 0 || p.x > canvas.width) p.sx *= -1;
            if(p.y < 0 || p.y > canvas.height) p.sy *= -1;
            ctx.fillStyle = '#0891b2'; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
        });
        requestAnimationFrame(animate);
    }
    animate();

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('fileInput');
    const statusText = document.getElementById('status-text');

    dropZone.onclick = () => fileInput.click();
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
        dropZone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); });
    });

    dropZone.addEventListener('drop', (e) => handleFileUpload(e.dataTransfer.files[0]));
    fileInput.onchange = (e) => handleFileUpload(e.target.files[0]);

    async function handleFileUpload(file) {
        if (!file) return;
        statusText.innerText = "Analyzing Blueprint...";
        const formData = new FormData();
        formData.append('file', file);
        try {
            const response = await fetch('http://localhost:8080/api/code/fsm-structure', {
                method: 'POST',
                body: formData
            });
            if (response.ok) {
                gsap.to("#content", { opacity: 0, scale: 0.9, duration: 1, ease: "power4.inOut" });
                gsap.to("canvas", { opacity: 0, duration: 2 });
                setTimeout(() => window.location.href = '/index.html', 1000);
            } else {
                statusText.innerText = "Error: Invalid TBRD Format.";
            }
        } catch (err) {
            statusText.innerText = "Connection Failed.";
        }
    }
</script>
</body>
</html>
