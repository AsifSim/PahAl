spring.application.name=pahal
# Tell Spring AI where your local Ollama engine is listening
spring.ai.ollama.base-url=http://localhost:11501

# Specify the exact AI model you want Ollama to run (e.g., llama3, mistral, deepseek-coder)
spring.ai.ollama.chat.options.model=llama3.2:latest
#spring.ai.ollama.chat.options.model=llama3.1:8b
LOG_FILE_PATH=C://logs//abcd
spring.ai.ollama.chat.options.temperature=0
spring.ai.ollama.chat.options.top-p=0.8
spring.ai.ollama.chat.options.repeat-penalty=1.1
spring.ai.ollama.chat.options.num-ctx=8192
spring.ai.ollama.chat.options.num-batch=1024
spring.ai.ollama.chat.options.keep-alive=5h