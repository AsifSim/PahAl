spring.application.name=pahal
# Tell Spring AI where your local Ollama engine is listening
spring.ai.ollama.base-url=http://localhost:11434
ollama.api.url=http://localhost:11434/api/generate

# Specify the exact AI model you want Ollama to run (e.g., llama3, mistral, deepseek-coder)
#spring.ai.ollama.chat.model=llama3.2:latest
#spring.ai.ollama.chat.model=gpt-oss:20b
#spring.ai.ollama.chat.model=gemma4:12b
#spring.ai.ollama.chat.model=deepseek-r1:8b
spring.ai.ollama.chat.model=qwen2.5-coder:14b
#spring.ai.ollama.chat.model=llama3.2:latest
ollama.vision.model=minicpm-v:8b
LOG_FILE_PATH=C://logs//abcd
spring.ai.ollama.chat.temperature=0
spring.ai.ollama.chat.top-p=0.8
spring.ai.ollama.chat.repeat-penalty=1.1
spring.ai.ollama.chat.num-ctx=12288
spring.ai.ollama.chat.num-batch=1024
spring.ai.ollama.chat.keep-alive=5h

# Database configuration "to be removed"
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/agent_dev
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Custom app properties
app.upload.dir=${user.home}/pahal-uploads


# sangam
#================================================================
build.workspace=tmp/build-new

# --- Configuration File Paths ---
# These replace the hardcoded strings that were previously in the Java code
config.path.docker-map=configs/global/docker_deploy_map.json
config.path.server-config=configs/environments/server_config.json
config.path.angular-map=configs/global/angular_metadata.json
config.path.project-dependencies=configs/global/project_dependencies.json
config.path.artifact-map=configs/global/artifact_repo_map.json
config.path.env-properties=configs/environments/env_properties.json
config.path.logback-master=configs/global/standard-logback.xml
config.path.repo-versions=configs/global/repo_versions.json

# --- External Integration Settings ---
google.sheet.webhook.url=https://script.google.com/macros/s/AKfycbwQYuhjBT6UtkT1WQUI1cRRdwo8iOXwaUXF3Q4Xk4BTx2HVkENxvbm55szvUddxOGJE/exec
config.date-format.standard=yyyy-MM-dd HH:mm:ss

# --- Service Logic Settings ---
config.project-detector.max-depth=5

# Backend URLs
JAVA_API_URL=http://localhost:8081/api/build/initiate
JAVA_STATUS_URL=http://localhost:8081/api/build/status
JAVA_HISTORY_URL=http://localhost:8081/api/build/history/latest

DB_URL: jdbc:postgresql://host.docker.internal:5432/agent_dev
DB_USERNAME: postgres

# Google Sheets Configuration
GOOGLE_SHEET_ID: your_spreadsheet_id_here
GOOGLE_SERVICE_ACCOUNT_FILE: configs/global/google_credentials.json

# If you prefer using raw credentials (though JSON file is recommended)
GOOGLE_SHEET_USER_EMAIL: asif.azmi@simadvisorypartner.com

# Security
GITHUB_TOKEN:
ORG_NAME: simaiserver

# App Config
FLASK_PORT: 5000
ALLOWED_ORIGINS: http://localhost:4200

ARTIFACT_MAP_FILE: config/artifact_repo_map.json
REPOS_FILE: config/repos.json
BRANCHES_FILE: config/branches.json
TAGS_FILE: config/tags.json
SERVERS_FILE: config/servers.json
ANGULAR_METADATA_FILE: config/angular_metadata.json

#=============================================================
#DVM
#============================================================
# Python Agent Configuration
python.agent.base-path=dvm/adk_final-initial_commit
python.agent.venv-path=.venv
python.agent.script=main.py
python.agent.python-command=python3
python.agent.timeout-seconds=300

# Generated Files Directory
generated.file.path=${java.io.tmpdir}/dvm-output

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

ollama.prompt.template.path=TBRDTemplate.yaml